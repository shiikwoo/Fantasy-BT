name: Atualizar Fantasy Dashboard

on:
  schedule:
    # Executa todos os dias às 10:27 UTC (11:27 CET / 07:27 BRT)
    # Minuto quebrado para evitar fila e descarte no GitHub Actions
    - cron: '27 10 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão a qualquer momento

permissions:
  contents: write

jobs:
  sync-sleeper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script do Sleeper
        run: python update_sleeper.py

      - name: Salvar alterações no GitHub Pages
        run: |
          git config --global user.name "Sleeper Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sincronizacao automatica com Sleeper" && git push)
