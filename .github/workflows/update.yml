name: Atualizar Fantasy Dashboard

on:
  schedule:
    # Executa toda terca-feira as 10:00 UTC (07:00 horario de Brasilia)
    - cron: '0 10 * * 2'
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Opcional: informe o novo League ID do Sleeper (ex.: na virada de temporada)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-sleeper:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      SLEEPER_LEAGUE_ID: ${{ github.event.inputs.league_id || vars.SLEEPER_LEAGUE_ID || '' }}
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script do Sleeper
        run: python update_sleeper.py

      - name: Salvar alteracoes no GitHub Pages
        run: |
          git config --global user.name "Sleeper Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sincronizacao automatica do snapshot da temporada" && git push)
